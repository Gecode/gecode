name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'release/**'

permissions:
  contents: read

# A new push to a pull request supersedes its running checks.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release

jobs:
  # Formatting, changelog, generated sources, Clang build, clang-tidy, the
  # full test suite with audit and fault injection, packages, and docs.
  check-extended:
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

    - name: Install uv
      uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
      with:
        enable-cache: false

    - name: Install LLVM 22 and check dependencies
      shell: bash
      run: |
        curl --fail --location --retry 3 https://apt.llvm.org/llvm-snapshot.gpg.key -o "$RUNNER_TEMP/llvm.asc"
        sudo install -m 644 "$RUNNER_TEMP/llvm.asc" /usr/share/keyrings/llvm.asc
        echo 'deb [signed-by=/usr/share/keyrings/llvm.asc] https://apt.llvm.org/noble/ llvm-toolchain-noble-22 main' | sudo tee /etc/apt/sources.list.d/llvm.list
        # The runner's packages.microsoft.com source has failed apt-get update with 403; no job needs it.
        sudo find /etc/apt/sources.list.d -type f -exec grep -q packages.microsoft.com {} \; -delete
        sudo apt-get update
        sudo apt-get install -y clang-22 clang-format-22 clang-tidy-22 clang-tools-22 \
          ninja-build bison flex graphviz libgmp-dev libmpfr-dev \
          qt6-base-dev qt6-base-dev-tools libgl1-mesa-dev

    - name: Install Doxygen 1.18.0
      shell: bash
      run: |
        archive="$RUNNER_TEMP/doxygen-1.18.0.linux.bin.tar.gz"
        # doxygen.nl has served runners a small HTML page instead of the archive.
        curl --fail --location --retry 3 -o "$archive" \
          https://github.com/doxygen/doxygen/releases/download/Release_1_18_0/doxygen-1.18.0.linux.bin.tar.gz
        printf '%s  %s\n' 14fa81bdc34171edb5f1f02b1d60e74802f0439b77fa44e592565d517d72df90 "$archive" | sha256sum --check
        mkdir -p "$RUNNER_TEMP/doxygen"
        tar -xzf "$archive" -C "$RUNNER_TEMP/doxygen" --strip-components=1
        doxygen_bin="$(find "$RUNNER_TEMP/doxygen" -type f -name doxygen -print -quit)"
        "$doxygen_bin" --version
        dirname "$doxygen_bin" >> "$GITHUB_PATH"

    - name: Configure full Debug checks
      shell: bash
      run: >
        cmake -S . -B build/check-extended -G Ninja
        -DCMAKE_BUILD_TYPE=Debug
        -DCMAKE_C_COMPILER=clang-22 -DCMAKE_CXX_COMPILER=clang++-22
        -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
        -DGECODE_ENABLE_EXPERIMENTAL=ON -DGECODE_ENABLE_CBS=ON
        -DGECODE_ENABLE_AUDIT=ON -DGECODE_ENABLE_FAULT_INJECTION=ON
        -DGECODE_ENABLE_QT=ON -DGECODE_ENABLE_GIST=ON -DGECODE_ENABLE_MPFR=ON
        -DGECODE_ENABLE_EXAMPLES=ON -DGECODE_REGENERATE_VARIMP=ON

    - name: Run all checks
      shell: bash
      run: uv run misc/check.py all --build-dir build/check-extended --jobs 4

    - name: Qt/Gist consumer smoke test
      shell: bash
      env:
        CXX: clang++-22
      run: bash .github/ci/qt-gist-consumer-smoke.sh "$GITHUB_WORKSPACE/build/check-extended/check-install"

  # GCC Release build without experimental APIs, plus the installed-package,
  # FlatZinc, allocator, and 32-bit smokes.
  build-linux:
    runs-on: ubuntu-24.04
    env:
      CC: gcc-14
      CXX: g++-14

    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

    - name: Install uv
      uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
      with:
        enable-cache: false

    - name: Install build deps
      shell: bash
      run: |
        # The runner's packages.microsoft.com source has failed apt-get update with 403; no job needs it.
        sudo find /etc/apt/sources.list.d -type f -exec grep -q packages.microsoft.com {} \; -delete
        sudo apt-get update
        sudo apt-get install -y g++-14 g++-14-multilib libgmp-dev libmpfr-dev ninja-build

    - name: Install MiniZinc 2.10.1
      shell: bash
      run: |
        archive="$RUNNER_TEMP/minizinc-2.10.1.tgz"
        minizinc_dir="$RUNNER_TEMP/minizinc-2.10.1"
        curl --fail --location --retry 3 --output "$archive" \
          https://github.com/MiniZinc/MiniZincIDE/releases/download/2.10.1/MiniZincIDE-2.10.1-x86_64-linux-gnu.tgz
        printf '%s  %s\n' b63dd88491d47b05d0eb0ff4aa1112d1e6f77292c023800b20b98851458ce01c "$archive" | sha256sum --check
        mkdir -p "$minizinc_dir"
        tar -xzf "$archive" -C "$minizinc_dir" --strip-components=1
        echo "$minizinc_dir/bin" >> "$GITHUB_PATH"
        "$minizinc_dir/bin/minizinc" --version

    - name: Configure CMake
      shell: bash
      # The absolute include dir checks package config handling for absolute install dirs.
      run: >
        cmake -S "$GITHUB_WORKSPACE" -B "$GITHUB_WORKSPACE/build"
        "-DCMAKE_BUILD_TYPE=$BUILD_TYPE"
        -DGECODE_REGENERATE_VARIMP=ON
        -DCMAKE_INSTALL_INCLUDEDIR=/tmp/gecode-install-abs-include

    - name: Build
      shell: bash
      run: cmake --build "$GITHUB_WORKSPACE/build" --parallel 4

    - name: Check
      shell: bash
      run: cmake --build "$GITHUB_WORKSPACE/build" --target check

    - name: Run public test harness smokes
      shell: bash
      run: ctest --test-dir "$GITHUB_WORKSPACE/build" --output-on-failure -R '^public-.*-smoke$'

    - name: Examples reading instance files
      shell: bash
      run: bash .github/ci/instance-example-smoke.sh "$GITHUB_WORKSPACE/build/bin"

    - name: Install CMake package
      shell: bash
      run: cmake --install "$GITHUB_WORKSPACE/build" --prefix "$GITHUB_WORKSPACE/install"

    - name: Consumer smoke tests
      shell: bash
      run: >
        bash .github/ci/cmake-consumer-smoke.sh
        "$GITHUB_WORKSPACE/install" /tmp/gecode-install-abs-include mpfr

    - name: Package version checks
      shell: bash
      run: bash .github/ci/cmake-package-version-checks.sh "$GITHUB_WORKSPACE/install"

    - name: FlatZinc tools smoke test
      shell: bash
      run: bash .github/ci/flatzinc-tools-smoke.sh "$GITHUB_WORKSPACE/install"

    - name: Example feature selection
      shell: bash
      run: bash .github/ci/cmake-example-feature-smoke.sh

    - name: Disabled module closure checks
      shell: bash
      run: bash .github/ci/cmake-closure-checks.sh

    - name: CMake custom VIS checks
      shell: bash
      run: bash .github/ci/cmake-custom-vis-smoke.sh

    - name: Gist static macro compatibility
      shell: bash
      run: bash .github/ci/gist-static-macro-smoke.sh

    - name: Scoped mimalloc allocator
      shell: bash
      run: bash .github/ci/allocator-smoke.sh "$GITHUB_WORKSPACE" "$RUNNER_TEMP/gecode-allocator"

    - name: 32-bit linkage
      shell: bash
      run: bash .github/ci/32-bit-linkage-smoke.sh "$GITHUB_WORKSPACE" "$RUNNER_TEMP/gecode-32-bit-linkage"

  # MSVC shared build: catches MSVC-only compile errors and missing DLL exports.
  build-windows:
    runs-on: windows-2022

    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

    - name: Install uv
      uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
      with:
        enable-cache: false

    - name: Configure CMake
      shell: pwsh
      run: >
        cmake -S "${{ github.workspace }}" -B "${{ github.workspace }}\\build"
        -G "Visual Studio 17 2022" -A x64
        -DGECODE_ENABLE_QT=OFF
        -DGECODE_ENABLE_GIST=OFF
        -DGECODE_ENABLE_MPFR=OFF
        -DGECODE_ENABLE_EXPERIMENTAL=ON

    - name: Build
      shell: pwsh
      run: cmake --build "${{ github.workspace }}\\build" --config ${{ env.BUILD_TYPE }}

    - name: Check
      shell: pwsh
      run: cmake --build "${{ github.workspace }}\\build" --config ${{ env.BUILD_TYPE }} --target check

    - name: Run public test harness smokes
      shell: pwsh
      run: ctest --test-dir "${{ github.workspace }}\\build" -C ${{ env.BUILD_TYPE }} --output-on-failure -R '^public-.*-smoke$'

    - name: Install CMake package
      shell: pwsh
      run: cmake --install "${{ github.workspace }}\\build" --config ${{ env.BUILD_TYPE }} --prefix "${{ github.workspace }}\\install"

    - name: Consumer smoke tests
      shell: pwsh
      run: .\.github\ci\cmake-consumer-smoke.ps1 "${{ github.workspace }}\install"

    - name: Installed test-library consumer
      shell: pwsh
      run: |
        $prefix = "${{ github.workspace }}\install"
        $build = "$env:RUNNER_TEMP\test-library-consumer"
        cmake -S test/package/public-test-component -B $build "-DCMAKE_PREFIX_PATH=$prefix"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        cmake --build $build --config $env:BUILD_TYPE
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        $env:PATH = "$prefix\bin;$env:PATH"
        ctest --test-dir $build -C $env:BUILD_TYPE --output-on-failure
